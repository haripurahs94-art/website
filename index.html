<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML বাংলা একাডেমি</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:"Noto Sans Bengali","Hind Siliguri","Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#0f172a}

/* ===== Navigation Bar ===== */
.site-nav{
  position:relative;z-index:50;flex:0 0 auto;
  display:flex;align-items:center;gap:14px;
  height:60px;padding:0 20px;
  background:linear-gradient(135deg,#059669,#0d9488);
  box-shadow:0 2px 14px #00000030;color:#fff;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.12rem;color:#fff;text-decoration:none;white-space:nowrap}
.brand span.logo{font-size:1.5rem}
.menu{display:flex;gap:6px;margin:0 0 0 auto;padding:0;list-style:none;align-items:center}
.menu a{
  display:block;color:#fff;text-decoration:none;font-weight:700;font-size:.97rem;
  padding:8px 15px;border-radius:999px;transition:background .15s;white-space:nowrap;
}
.menu a:hover{background:#ffffff2e}
.menu a.active{background:#fff;color:#047857;box-shadow:0 2px 8px #0000001f}
.burger{
  display:none;margin-left:auto;background:#ffffff26;border:0;color:#fff;
  width:42px;height:42px;border-radius:10px;font-size:1.4rem;cursor:pointer;line-height:1
}
.burger:hover{background:#ffffff40}

/* loading bar */
.loader{position:absolute;left:0;bottom:0;height:3px;width:0;background:#fde047;transition:width .3s ease,opacity .3s}
.loader.run{width:80%}
.loader.done{width:100%;opacity:0}

/* ===== Page area ===== */
.stage{flex:1 1 auto;position:relative;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:block}

/* ===== Mobile ===== */
@media (max-width:760px){
  .site-nav{padding:0 14px}
  .burger{display:block}
  .menu{
    position:absolute;top:60px;left:0;right:0;flex-direction:column;align-items:stretch;gap:4px;
    margin:0;padding:10px 14px 14px;background:#047857;box-shadow:0 12px 24px #00000040;
    display:none;
  }
  .menu.open{display:flex}
  .menu a{border-radius:10px;padding:12px 14px;font-size:1.02rem}
}
</style>
</head>
<body>

<header class="site-nav">
  <a class="brand" href="#/" id="brand"><span class="logo">📚</span> HTML বাংলা একাডেমি</a>
  <button class="burger" id="burger" aria-label="মেনু খুলুন" aria-expanded="false">☰</button>
  <ul class="menu" id="menu"></ul>
  <div class="loader" id="loader"></div>
</header>

<main class="stage">
  <iframe id="view" title="পেজ কনটেন্ট" allow="clipboard-write; clipboard-read"></iframe>
</main>

<script>
/* ==========================================================
   নতুন পেজ যোগ করতে চাইলে নিচের PAGES তালিকায় একটি লাইন যোগ করুন:

   { id:"about", title:"ℹ️ আমাদের সম্পর্কে", file:"pages/about.html" },

   - id    : URL-এ দেখাবে (index.html#/about)  — ইংরেজি, স্পেস ছাড়া
   - title : নেভিগেশন বারে যে নাম দেখাবে
   - file  : পেজের ফাইলের পথ (ফাইলটি pages ফোল্ডারে রাখুন)
   তালিকার প্রথম পেজটিই হোম (ডিফল্ট) পেজ।
   ========================================================== */
const PAGES = [
  { id:"html",   title:"🏠 HTML কোর্স",      file:"pages/html-course.html" },
  { id:"access", title:"🗄️ MS Access",        file:"pages/access.html" },
  { id:"mobile", title:"📱 ভয়েস টাইপিং অ্যাপ", file:"pages/mobile.html" }
];
const SITE_NAME = "HTML বাংলা একাডেমি";

const menu   = document.getElementById("menu");
const burger = document.getElementById("burger");
const view   = document.getElementById("view");
const loader = document.getElementById("loader");
let currentId = null;

/* মেনু তৈরি */
PAGES.forEach(p=>{
  const li = document.createElement("li");
  const a  = document.createElement("a");
  a.href = "#/" + p.id;
  a.textContent = p.title;
  a.dataset.id = p.id;
  li.appendChild(a);
  menu.appendChild(li);
});

function closeMenu(){
  menu.classList.remove("open");
  burger.setAttribute("aria-expanded","false");
  burger.textContent = "☰";
}
burger.addEventListener("click",()=>{
  const open = menu.classList.toggle("open");
  burger.setAttribute("aria-expanded", open);
  burger.textContent = open ? "✕" : "☰";
});
menu.addEventListener("click",closeMenu);

/* পেজ লোড */
function route(){
  const id = (location.hash.replace(/^#\/?/,"") || PAGES[0].id);
  const page = PAGES.find(p=>p.id===id) || PAGES[0];

  menu.querySelectorAll("a").forEach(a=>a.classList.toggle("active", a.dataset.id===page.id));
  document.title = page.title.replace(/^\S+\s/,"") + " | " + SITE_NAME;

  if(currentId === page.id) return;
  currentId = page.id;

  loader.className = "loader";
  void loader.offsetWidth;
  loader.classList.add("run");
  view.src = page.file;
}
view.addEventListener("load",()=>{
  loader.classList.remove("run");
  loader.classList.add("done");
});

window.addEventListener("hashchange",route);
document.getElementById("brand").addEventListener("click",()=>{ location.hash = "#/" + PAGES[0].id; closeMenu(); });
route();
</script>
</body>
</html>
